<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Importante: viewport para que se vea bien en celulares y tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flores amarillas para ti 💛</title>

  <!-- Tipografía elegante (Google Fonts). Si no hay internet, el navegador usa una fuente parecida del sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       BLOQUE 1: ESTILOS GENERALES Y FONDO DE ATARDECER
       ============================================================ */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;                 /* Evita desplazamiento horizontal en cualquier pantalla */
      font-family: 'Quicksand', sans-serif;
    }

    /* El contenedor de toda la escena ocupa toda la pantalla */
    .escena {
      position: fixed;                    /* Fija la escena a la ventana */
      inset: 0;                          /* Ocupa todo el alto y ancho */
      overflow: hidden;                  /* Nada se sale de la pantalla */
      background: linear-gradient(
        to bottom,
        #ffdf6b 0%,        /* amarillo suave en lo alto        */
        #ffb84d 25%,       /* naranja claro                    */
        #ff8a5c 45%,       /* naranja rosado                   */
        #ff7eb3 62%,       /* rosa                            */
        #a97bdb 78%,       /* lila/violeta al horizonte        */
        #e6f2c9 100%       /* verde claro (transición al suelo) */
      );
    }

    /* ============================================================
       BLOQUE 2: SOL
       ============================================================ */
    .sol {
      position: absolute;
      /* Centrado en la parte media-alta */
      top: 12%;
      left: 22%;
      z-index: 1;
      /* Un círculo amarillo grande con brillo alrededor */
      width: 26vmin;
      height: 26vmin;
      border-radius: 50%;
      background: radial-gradient(circle, #fff8b8 20%, #ffd93d 45%, rgba(255, 180, 60, 0.9) 70%, rgba(255, 140, 60, 0.05) 100%);
      box-shadow: 0 0 60px 30px rgba(255, 210, 80, 0.55);
      animation: solBrillo 5s ease-in-out infinite;
    }

    /* El sol "respira": cambia suavemente su brillo */
    @keyframes solBrillo {
      0%, 100% { box-shadow: 0 0 50px 20px rgba(255, 210, 80, 0.4); }
      50%      { box-shadow: 0 0 80px 40px rgba(255, 210, 80, 0.7); }
    }

    /* ============================================================
       BLOQUE 3: NUBES
       ============================================================ */
    .nube {
      position: absolute;
      z-index: 2;
      opacity: 0.85;
    }

    /* Cada nube es un grupo de círculos suaves */
    .nube svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Las nubes se mueven lentamente de izquierda a derecha
       y la escena las repite en bucle (de la misma nube). */
    .nube--1 { top: 6%; left: -10%; width: 34vmin; animation: nubePaseo 60s linear infinite; }
    .nube--2 { top: 15%; left: -20%; width: 26vmin; animation: nubePaseo 85s linear infinite; animation-delay: -30s; }
    .nube--3 { top: 3%;  left: -30%; width: 30vmin; animation: nubePaseo 75s linear infinite; animation-delay: -50s; }

    @keyframes nubePaseo {
      from { transform: translateX(0); }
      to   { transform: translateX(130vw); }  /* Cruza toda la pantalla */
    }

    /* ============================================================
       BLOQUE 4: EL SUELO (CAMPO VERDE)
       ============================================================ */
    .suelo {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 34%;
      z-index: 3;
      background: linear-gradient(to bottom, #7ec850 0%, #4e9c2f 35%, #2f7a1e 100%);
      border-top: 4px solid rgba(255, 255, 255, 0.25);
      border-radius: 100% 100% 0 0 / 8% 8% 0 0;   /* Curva suave de colina */
    }

    /* Césped: pequeñas líneas de hierba dibujadas con CSS */
    .cesped {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .brizna {
      position: absolute;
      bottom: 0;
      width: 2px;
      height: 12px;
      background: #3d8822;
      border-radius: 2px;
      transform-origin: bottom center;
      animation: vientoBrizna ease-in-out infinite;
    }

    @keyframes vientoBrizna {
      0%, 100% { transform: rotate(-6deg); }
      50%      { transform: rotate(6deg); }
    }

    /* ============================================================
       BLOQUE 5: LAS FLORES (SVG creadas por JavaScript)
       ============================================================ */
    .flor {
      position: absolute;
      z-index: 4;                        /* Delante del suelo */
      transform-origin: bottom center;   /* El punto de giro es la base (el tallo) */
      animation: vientoFlor ease-in-out infinite;
      will-change: transform;
    }

    /* Balanceo suave con el viento: un poco a la izquierda, un poco a la derecha */
    @keyframes vientoFlor {
      0%, 100% { transform: rotate(-2deg); }
      50%      { transform: rotate(2.5deg); }
    }

    /* Algunas flores están detrás (más pequeñas y un poco apagadas, con viento distinto) */
    .flor--detras {
      z-index: 1;
      filter: brightness(0.85) saturate(0.9);
    }

    /* Clases que indican el momento de animación de cada parte de la flor */
    .flor .tallo { transform-origin: bottom center; }
    .flor .petalos { transform-origin: center center; opacity: 0; }
    .flor.creciendo .tallo  { animation: crecerTallo 1.4s ease-out forwards; }
    .flor.creciendo .petalos { animation: aparecerFlor 1s ease-out forwards; animation-delay: 1.1s; }

    /* Los tallos crecen desde el suelo hacia arriba */
    @keyframes crecerTallo {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }

    /* Los pétalos aparecen "reventando" suavemente después del tallo */
    @keyframes aparecerFlor {
      from { opacity: 0; transform: scale(0.3); }
      70%  { opacity: 1; transform: scale(1.08); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Las hojas del tallo se mecen (animación separada del tallo) */
    .hoja-izq, .hoja-der {
      transform-origin: center center;
      animation: vientoHoja 3.5s ease-in-out infinite;
    }
    @keyframes vientoHoja {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(5deg); }
    }

    /* Brillo que da vueltas alrededor del centro de cada flor */
    .brillo {
      transform-origin: center;
      animation: girarBrillo 14s linear infinite;
    }
    @keyframes girarBrillo {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Pequeños puntos de luz flotando alrededor de cada flor */
    .polen {
      animation: flotarPolen ease-in-out infinite;
    }
    @keyframes flotarPolen {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.9; }
      50%      { transform: translateY(-12px) translateX(6px); opacity: 0.4; }
    }

    /* ============================================================
       BLOQUE 6: PARTÍCULAS DEL FONDO (LUCES QUE BRILLAN)
       ============================================================ */
    .particula {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fffbe0 0%, rgba(255, 220, 120, 0) 70%);
      z-index: 2;
      animation: brillarParticula ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes brillarParticula {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50%      { opacity: 0.9;  transform: scale(1.25); }
    }

    /* ============================================================
       BLOQUE 7: MENSAJE ROMÁNTICO
       ============================================================ */
    .mensaje {
      position: absolute;
      top: 6%;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 5;                       /* Por encima de todo */
      padding: 0 12px;
      pointer-events: none;
    }

    .mensaje h1 {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: clamp(2.4rem, 7vmin, 4.5rem);
      color: #fff6d8;
      text-shadow: 2px 4px 12px rgba(140, 60, 10, 0.45), 0 0 24px rgba(255, 220, 120, 0.55);
      margin: 0 0 0.5rem 0;
      opacity: 0;
      animation: aparecerMensaje 1.6s ease-out forwards;
    }

    .mensaje .frase {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.6rem, 4.6vmin, 2.8rem);
      color: #fff1c9;
      text-shadow: 1px 2px 8px rgba(140, 60, 10, 0.4);
      opacity: 0;
    }

    .mensaje .frase--inicial {
      /* La primera frase aparece junto con el título */
      animation: aparecerMensaje 1.8s ease-out forwards;
      animation-delay: 0.3s;
    }

    .mensaje .frase--final {
      /* La parte que se muestra después de unos segundos */
      display: none;
      margin-top: 0.4rem;
    }

    /* Cuando el cuerpo lleva la clase "mensaje-2", cambia el contenido */
    body.mensaje-2 .mensaje .frase--inicial { display: none; }
    body.mensaje-2 .mensaje .frase--final   { display: block; animation: aparecerMensaje 1.8s ease-out forwards; }

    @keyframes aparecerMensaje {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       BLOQUE 8: BOTONES Y CONTROLES
       ============================================================ */
    .controles {
      position: absolute;
      bottom: 3%;
      right: 3%;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .controles .grupo-musica {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: clamp(0.85rem, 1.8vmin, 1rem);
      padding: 10px 16px;
      border: none;
      border-radius: 40px;
      color: #5a3a00;
      background: linear-gradient(to bottom, #ffe57a, #ffc64d);
      box-shadow: 0 4px 14px rgba(90, 50, 0, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(90, 50, 0, 0.45);
    }

    button:active {
      transform: translateY(0) scale(0.96);
    }

    /* Control de volumen (siempre visible en la esquina) */
    .grupo-musica input[type="range"] {
      width: 110px;
      accent-color: #5a3a00;
      display: inline-block;
    }

    /* ============================================================
       BLOQUE 9: PARTÍCULAS DE REGALO, CORAZONES Y MENSAJE FLOTANTE
       ============================================================ */
    .particula-regalo {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6a8 0%, rgba(255, 210, 60, 0) 75%);
      z-index: 7;
      pointer-events: none;
      animation: caerParticula ease-in linear forwards;
    }
    @keyframes caerParticula {
      from { transform: translateY(10px); opacity: 1; }
      to   { transform: translateY(60vh); opacity: 0; }
    }

    .corazon {
      position: absolute;
      color: #ff5d8f;
      z-index: 7;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(200, 20, 90, 0.4);
      animation: subirCorazon ease-in-out forwards;
    }
    @keyframes subirCorazon {
      from { transform: translateY(0) scale(0.6); opacity: 0.9; }
      to   { transform: translateY(-75vh) scale(1.15); opacity: 0; }
    }

    .mensaje-flotante {
      position: absolute;
      top: 34%;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 8;
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.8rem, 5vmin, 3rem);
      color: #fff7dc;
      text-shadow: 2px 3px 10px rgba(140, 60, 10, 0.5);
      opacity: 0;
      pointer-events: none;
      animation: flotarYDesvanecer 3.2s ease-in-out forwards;
    }

    /* El mensaje flotante aparece, sube un poco y se desvanece */
    @keyframes flotarYDesvanecer {
      0%   { opacity: 0; transform: translateY(20px); }
      20%  { opacity: 1; }
      60%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-30px); }
    }

    /* ============================================================
       BLOQUE 9b: PORTADA DE ENTRADA (PANTALLA INICIAL)
       ============================================================ */
    .portada {
      position: fixed;
      inset: 0;
      z-index: 100;                       /* Siempre por encima de todo */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      padding: 24px;
      color: #fff6d8;
      background: linear-gradient(160deg, #ffe98a 0%, #ffa35c 40%, #ff7eb3 75%, #b7d789 100%);
      transition: opacity 1s ease, visibility 1s ease;
      font-family: 'Quicksand', sans-serif;
    }

    .portada h1 {
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      font-size: clamp(2.6rem, 9vmin, 5.5rem);
      margin: 0;
      text-shadow: 2px 4px 12px rgba(140, 60, 10, 0.4);
      animation: solBrillo 5s ease-in-out infinite;
    }

    .portada p {
      font-size: clamp(1rem, 2.6vmin, 1.3rem);
      color: #ffeec9;
      text-shadow: 0 2px 6px rgba(140, 60, 10, 0.35);
      margin: 0;
    }

    .portada .nota {
      font-size: clamp(0.8rem, 2vmin, 1rem);
      opacity: 0.85;
    }

    .boton-entrar {
      font-size: clamp(1.1rem, 3.4vmin, 1.7rem);
      padding: 16px 30px;
      border-radius: 50px;
      color: #5a3a00;
      background: linear-gradient(to bottom, #fff0a0, #ffc64d);
      box-shadow: 0 6px 20px rgba(140, 60, 10, 0.45);
      animation: pulsoBoton 2.2s ease-in-out infinite;
    }

    /* El botón "late" suavemente para invitar al clic */
    @keyframes pulsoBoton {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    /* Cuando la portada se oculta, se desvanece y no estorba los clics */
    .portada.oculta {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ============================================================
       BLOQUE 10: RESPONSIVE (CELULARES Y TABLETS)
       ============================================================ */
    @media (max-width: 640px) {
      .controles {
        bottom: 2%;
        right: 2%;
      }
      .grupo-musica input[type="range"] {
        width: 80px;
      }
      .suelo { height: 30%; }
      .sol { top: 14%; left: 16%; width: 30vmin; height: 30vmin; }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       SCENA: fondo de atardecer + sol + nubes + suelo
       ============================================================ -->
  <div class="escena">

    <!-- SOL -->
    <div class="sol"></div>

    <!-- NUBES (dibujadas con SVG) -->
    <div class="nube nube--1">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="55"  cy="48" rx="42" ry="24" fill="#ffffff" opacity="0.8"/>
        <ellipse cx="100" cy="38" rx="52" ry="30" fill="#ffffff" opacity="0.9"/>
        <ellipse cx="150" cy="52" rx="40" ry="20" fill="#ffffff" opacity="0.8"/>
      </svg>
    </div>

    <div class="nube nube--2">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60"  cy="45" rx="50" ry="26" fill="#ffd9e8" opacity="0.75"/>
        <ellipse cx="115" cy="35" rx="58" ry="32" fill="#ffd9e8" opacity="0.85"/>
        <ellipse cx="165" cy="48" rx="42" ry="22" fill="#ffd9e8" opacity="0.75"/>
      </svg>
    </div>

    <div class="nube nube--3">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60"  cy="46" rx="46" ry="24" fill="#ffe3f0" opacity="0.7"/>
        <ellipse cx="110" cy="36" rx="54" ry="28" fill="#ffe3f0" opacity="0.8"/>
        <ellipse cx="158" cy="50" rx="40" ry="20" fill="#ffe3f0" opacity="0.7"/>
      </svg>
    </div>

    <!-- Caja que JavaScript llenará con luces aleatorias que brillan -->
    <div id="capaLuces"></div>

    <!-- Caja donde JavaScript dibuja y coloca las FLORES -->
    <div id="campoFlores"></div>

    <!-- SUELO VERDE (campo/jardín) -->
    <div class="suelo">
      <!-- Caja donde JavaScript dibuja el césped -->
      <div class="cesped" id="cesped"></div>
    </div>

    <!-- MENSAJE ROMÁNTICO -->
    <div class="mensaje">
      <h1>Para ti 💛</h1>
      <p class="frase frase--inicial">Que nunca seas  una expectadora aqui </p>
      <p class="frase frase--final">
        Que nunca seas  una expectadora aqui <br/>
        <span>estan son  tus flores amarillas </span>
      </p>
    </div>

    <!-- BOTONES Y MÚSICA -->
    <div class="controles">
      <div class="grupo-musica">
        <input type="range" id="volumen" min="0" max="1" step="0.05" value="0.7" aria-label="Volumen" />
      </div>
      <button id="btnRegalar">🌻 Regalar flores</button>
    </div>
  </div>

  <!-- ============================================================
       PORTADA DE ENTRADA (desbloquea la música al hacer clic)
       ============================================================ -->
  <div class="portada" id="portada">
    <h1>Un regalo para ti ❤️ </h1>
    <p>Hay una canción y un campo de flores esperándote  solo para ti </p>
    <button id="btnEntrar" class="boton-entrar"> Entrar aqui </button>
    <p class="nota">El clic activa la música desde el principio</p>
  </div>

  <!-- MÚSICA: archivo local musica.mp3 -->
  <audio id="musica" src="musica.mp3" loop></audio>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    // La música se inicia con el atributo preload para que
    // el navegador la cargue de una vez (el autoplay está bloqueado).
    document.getElementById('musica').preload = 'auto';

    /* ------------------------------------------------------------
       PARTE 1: DIBUJAR UNA FLOR CON SVG
       ------------------------------------------------------------
       Creamos un girasol completo (tallo, hojas, pétalos, centro)
       como una imagen SVG. Todo se genera con código.           */
    function crearFlorSVG() {
      // Cada pétalo es el mismo óvalo girando alrededor del centro.
      // Lo generamos dentro de un <g> con el centro en (0,0).
      const petalos = [];
      const numeroPetalos = 12;      // 12 pétalos alrededor del centro
      const anguloPaso = 360 / numeroPetalos;

      for (let i = 0; i < numeroPetalos; i++) {
        const angulo = i * anguloPaso;
        petalos.push(
          '<ellipse ' +
            'cx="0" cy="-26" rx="7.5" ry="16" ' +
            'fill="#ffd23f" stroke="#ffb400" stroke-width="0.6" ' +
            'transform="rotate(' + angulo + ')" />'
        );
      }

      // Dentro de la flor: un anillo interior de pétalos más cortos
      const petalosInteriores = [];
      for (let i = 0; i < 10; i++) {
        const angulo = i * 36 + 18;   // desfasados para que entren entre los otros
        petalosInteriores.push(
          '<ellipse ' +
            'cx="0" cy="-19" rx="5" ry="10" ' +
            'fill="#ffdd66" stroke="none" ' +
            'transform="rotate(' + angulo + ')" />'
        );
      }

      // Juntamos TODO en un solo SVG
      return (
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -60 80 160">' +

          // ----- Tallo (línea verde)
          '<line class="tallo" x1="0" y1="95" x2="0" y2="-30" ' +
          'stroke="#3d8822" stroke-width="5" stroke-linecap="round" />' +

          // ----- Hoja izquierda (un óvalo achatado, verde)
          '<ellipse class="hoja-izq" cx="-20" cy="52" rx="15" ry="6" fill="#5db34a" ' +
          'transform="rotate(-35 -20 52)" />' +

          // ----- Hoja derecha
          '<ellipse class="hoja-der" cx="22" cy="28" rx="15" ry="6" fill="#4e9c2f" ' +
          'transform="rotate(28 22 28)" />' +

          // ----- Grupo de la cabeza de la flor (se mueve junto)
          '<g class="flor-cabeza">' +

            // ----- Pétalos
            '<g class="petalos">' +
              petalos.join('') +

              // Anillo interior
              '<g>' + petalosInteriores.join('') + '</g>' +
            '</g>' +

            // ----- Centro marrón con puntos
            '<circle class="centro" cx="0" cy="0" r="13" fill="#7a4a1d" />' +
            '<circle cx="0" cy="0" r="9" fill="#99571f" />' +
            '<circle cx="0" cy="-3" r="3" fill="#b37230" opacity="0.7" />' +
            '<circle cx="4" cy="2" r="2" fill="#b37230" opacity="0.6" />' +
            '<circle cx="-3" cy="3" r="2.2" fill="#b37230" opacity="0.6" />' +

            // ----- Brillo girando alrededor de la flor
            '<g class="brillo">' +
              '<circle cx="0" cy="-30" r="2" fill="#fffbd8" opacity="0.9" />' +
              '<circle cx="21" cy="-21" r="1.6" fill="#fffbd8" opacity="0.8" />' +
              '<circle cx="-21" cy="12" r="1.8" fill="#fffbd8" opacity="0.7" />' +
            '</g>' +
          '</g>' +
        '</svg>'
      );
    }

    /* ------------------------------------------------------------
       PARTE 2: COLOCAR FLORES EN EL CAMPO
       ------------------------------------------------------------ */
    const campo = document.getElementById('campoFlores');

    // Usamos distintas alturas para que unas tapen a otras
    const floresBase = [
      { xPorciento: 8,   altura: 55, tamano: 0.9,  retraso: 0.2,  atras: false },
      { xPorciento: 18,  altura: 62, tamano: 1.25, retraso: 0.6,  atras: false },
      { xPorciento: 28,  altura: 58, tamano: 1.0,  retraso: 0.9,  atras: false },
      { xPorciento: 40,  altura: 54, tamano: 1.4,  retraso: 1.2,  atras: false },
      { xPorciento: 50,  altura: 52, tamano: 1.6,  retraso: 1.5,  atras: false },
      { xPorciento: 61,  altura: 60, tamano: 1.1,  retraso: 1.8,  atras: false },
      { xPorciento: 72,  altura: 56, tamano: 1.35, retraso: 2.1,  atras: false },
      { xPorciento: 83,  altura: 64, tamano: 1.0,  retraso: 2.4,  atras: false },
      { xPorciento: 93,  altura: 57, tamano: 1.2,  retraso: 2.7,  atras: false },

      // Flores de fondo (más pequeñas y a menor escala, detrás de todos)
      { xPorciento: 12, altura: 66, tamano: 0.6, retraso: 3.0, atras: true },
      { xPorciento: 33, altura: 65, tamano: 0.7, retraso: 3.2, atras: true },
      { xPorciento: 55, altura: 68, tamano: 0.65, retraso: 3.4, atras: true },
      { xPorciento: 77, altura: 67, tamano: 0.7, retraso: 3.6, atras: true }
    ];

    function colocarFlores() {
      floresBase.forEach(function (datos) {
        crearFlorEnCampo(datos);
      });
    }

    // Crea una flor dentro del campo a partir de sus datos
    function crearFlorEnCampo(datos) {
      const div = document.createElement('div');
      div.className = 'flor' + (datos.atras ? ' flor--detras' : '');
      div.innerHTML = crearFlorSVG();

      // Tamaño de la flor en vmin (unidad que escala con la pantalla)
      const ancho = (datos.tamano * 42) + 'vmin';

      // El pie de la flor descansa sobre la parte baja de la pantalla.
      // altura (en vh) indica la altura de la planta sobre el suelo.
      div.style.width = ancho;
      div.style.left = datos.xPorciento + '%';
      div.style.bottom = (4 + (datos.altura - 50)) + 'vh';

      // Velocidad del viento (la animación dura distinto en cada flor)
      div.style.animationDuration = (4 + Math.random() * 2.5) + 's';
      div.style.animationDelay = (-Math.random() * 2) + 's';

      // Guardamos "creciendo" para disparar la animación de aparición
      // con un pequeño retraso distinto en cada flor.
      setTimeout(function () {
        div.classList.add('creciendo');
      }, datos.retraso * 1000);

      campo.appendChild(div);
    }

    /* ------------------------------------------------------------
       PARTE 3: POLEN (PUNTITOS BRILLANTES ALREDEDOR DE LAS FLORES)
       ------------------------------------------------------------ */
    function crearPolen(florDiv) {
      const contenedor = florDiv.querySelector('svg');
      const nsv = 'http://www.w3.org/2000/svg';

      for (let i = 0; i < 5; i++) {
        const c = document.createElementNS(nsv, 'circle');
        c.setAttribute('r', 1.8 + Math.random() * 1.5);
        c.setAttribute('fill', '#fff7c0');
        c.setAttribute('opacity', 0.85);
        // Posición aleatoria alrededor de la flor
        c.style.transform = 'translate(' +
          (Math.random() * 60 - 30) + 'px, ' +
          (Math.random() * 70 - 45) + 'px)';
        c.style.animationDuration = (2 + Math.random() * 3) + 's';
        c.classList.add('polen');
        contenedor.appendChild(c);
      }
    }

    // Añadimos el polen a cada flor después de colocarla
    function anadirPolenATodas() {
      document.querySelectorAll('.flor').forEach(crearPolen);
    }

    /* ------------------------------------------------------------
       PARTE 4: CÉSPED
       ------------------------------------------------------------ */
    const cesped = document.getElementById('cesped');
    for (let i = 0; i < 60; i++) {
      const b = document.createElement('div');
      b.className = 'brizna';
      b.style.left = (Math.random() * 100) + '%';
      b.style.height = (8 + Math.random() * 14) + 'px';
      b.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      b.style.animationDelay = (-Math.random() * 3) + 's';
      cesped.appendChild(b);
    }

    /* ------------------------------------------------------------
       PARTE 5: LUCES AL AZAR EN EL FONDO (LUCIÉRNAGAS)
       ------------------------------------------------------------ */
    const capaLuces = document.getElementById('capaLuces');
    function crearLuces(n) {
      for (let i = 0; i < n; i++) {
        const p = document.createElement('div');
        p.className = 'particula';
        const tam = 4 + Math.random() * 10;
        p.style.width = tam + 'px';
        p.style.height = tam + 'px';
        p.style.left = (Math.random() * 100) + '%';
        p.style.top = (Math.random() * 95) + '%';
        p.style.animationDuration = (2 + Math.random() * 4) + 's';
        p.style.animationDelay = (-Math.random() * 4) + 's';
        capaLuces.appendChild(p);
      }
    }
    crearLuces(45);

    /* ------------------------------------------------------------
       PARTE 6: MÚSICA AUTOMÁTICA Y PORTADA DE ENTRADA
       ------------------------------------------------------------ */
    const audio = document.getElementById('musica');
    const controlVolumen = document.getElementById('volumen');
    const portada = document.getElementById('portada');
    const btnEntrar = document.getElementById('btnEntrar');
    let haEntrado = false;

    // Reproduce la canción SIEMPRE desde el segundo 0
    function reproducirDesdeCero() {
      audio.currentTime = 0;      // Comienza desde 0 segundos
      return audio.play();
    }

    // Acción de "entrar": intenta la música, quita la portada y
    // hace crecer las flores. El guardián "haEntrado" evita que se
    // repita y que la música se reinicie con "Regalar flores".
    function entrar() {
      if (haEntrado) return;      // Solo se entra una vez
      haEntrado = true;

      colocarFlores();                           // Los tallos crecen del suelo
      anadirPolenATodas();                       // Puntitos brillantes

      portada.classList.add('oculta');           // Se despide la portada

      // La música suena desde el 0 s (el clic ya desbloqueó Chrome).
      // Si falla, la página funciona igual solo con las flores.
      reproducirDesdeCero().catch(function () {
        console.log('No se pudo reproducir la música automáticamente.');
      });

      // Después de unos segundos cambia la frase del mensaje
      setTimeout(function () {
        document.body.classList.add('mensaje-2');
      }, 6500);
    }

    // Botón grande de la portada: intenta la música y entra
    btnEntrar.addEventListener('click', entrar);

    // Al CARGAR la página intentamos reproducir automáticamente.
    // Si Chrome lo permite, entramos solos con la música desde el 0.
    // Si lo bloquea, la portada espera el clic del gran botón.
    (function intentarAutoplay() {
      const promesa = reproducirDesdeCero();
      if (promesa !== undefined) {
        promesa
          .then(entrar)
          .catch(function () {
            /* Bloqueado: la portada queda esperando el botón 🌻 */
          });
      }
    })();

    // Red de seguridad: si la portada sigue visible, el primer clic
    // en cualquier parte intenta entrar (desbloquea el audio
    // en móviles con políticas estrictas).
    document.addEventListener('click', function primerClic() {
      if (!haEntrado) entrar();
    }, { once: true });

    // El deslizador controla el volumen (0 = mudo, 1 = máximo)
    controlVolumen.addEventListener('input', function () {
      audio.volume = parseFloat(controlVolumen.value);
    });

    /* ------------------------------------------------------------
       PARTE 8: BOTÓN "REGALAR FLORES"
       ------------------------------------------------------------ */
    const btnRegalar = document.getElementById('btnRegalar');

    // Jugamos con un aplauso de partículas amarillas
    function explosionDeParticulas() {
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particula-regalo';

        const tam = 5 + Math.random() * 12;
        p.style.width = tam + 'px';
        p.style.height = tam + 'px';
        p.style.left = (5 + Math.random() * 90) + '%';
        p.style.top = (10 + Math.random() * 60) + '%';
        p.style.animationDuration = (1.2 + Math.random() * 1.5) + 's';
        p.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(p);

        // Limpiamos la partícula cuando termina su animación
        setTimeout(function () {
          if (p.parentNode) p.parentNode.removeChild(p);
        }, 3400);
      }
    }

    // Añadimos más flores por toda la pantalla
    function regalarFlores() {
      explosionDeParticulas();
      corazoncitos();

      // Aparición del mensaje flotante
      const msj = document.createElement('div');
      msj.className = 'mensaje-flotante';
      msj.textContent = 'Estas flores son para ti 💛';
      document.body.appendChild(msj);
      setTimeout(function () {
        msj.remove();
      }, 3300);

      // Colocamos 6 flores nuevas en posiciones al azar
      for (let i = 0; i < 6; i++) {
        const datos = {
          xPorciento: 5 + Math.random() * 90,
          altura: 50 + Math.random() * 14,
          tamano: 0.8 + Math.random() * 0.9,
          retraso: 0.1,
          atras: false
        };
        crearFlorEnCampo(datos);
      }

      // Repasar el polen de TODAS las flores (incluidas las nuevas)
      setTimeout(anadirPolenATodas, 300);
    }

    btnRegalar.addEventListener('click', regalarFlores);

    // Corazoncitos que suben lentamente por la pantalla
    function corazoncitos() {
      const emojis = ['💛', '💘', '💕', '💖', '❤️'];
      for (let i = 0; i < 14; i++) {
        const c = document.createElement('div');
        c.className = 'corazon';
        c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        c.style.left = (2 + Math.random() * 95) + '%';
        c.style.bottom = (2 + Math.random() * 15) + 'vh';
        c.style.fontSize = (14 + Math.random() * 22) + 'px';
        c.style.animationDuration = (5 + Math.random() * 4) + 's';
        document.body.appendChild(c);
        setTimeout(function () {
          c.remove();
        }, 9500);
      }
    }

    /* ------------------------------------------------------------
       PARTE 9: INICIO DE LA PÁGINA
       ------------------------------------------------------------ */
    // Las flores, el césped y las luces se preparan aquí.
    // (colocarFlores y anadirPolenATodas se ejecutan dentro de entrar(),
    //  para que los tallos crezcan en el momento de "iniciar".)
  </script>
</body>
</html>
